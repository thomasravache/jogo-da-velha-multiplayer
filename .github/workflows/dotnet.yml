name: dotnet-ci

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dotnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Format & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache do binário do Tailwind CSS
        id: tailwind-cache
        uses: actions/cache@v4
        with:
          path: tools/tailwind/bin
          key: tailwind-${{ runner.os }}-${{ hashFiles('tools/tailwind/version.txt') }}

      - name: Instalar Tailwind CSS standalone (sha256 verificado)
        if: steps.tailwind-cache.outputs.cache-hit != 'true'
        run: tools/tailwind/install.sh

      - name: Verificar drift do CSS gerado (Tailwind)
        run: tools/tailwind/build.sh --check

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore

      - name: Check code formatting (Roslyn/EditorConfig)
        run: dotnet format --verify-no-changes

      - name: Run automated test suite
        run: dotnet test --no-build --verbosity normal
