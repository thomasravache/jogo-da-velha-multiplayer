<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4757" />
      <stop offset="100%" stop-color="#3498db" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ff4757" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#3498db" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="28" fill="#16213e" stroke="url(#neonGrad)" stroke-width="3"/>
  <!-- Gamepad outline -->
  <path d="M30 46 C30 38, 42 34, 60 34 C78 34, 90 38, 90 46 C90 62, 84 84, 76 84 C70 84, 66 76, 60 76 C54 76, 50 84, 44 84 C36 84, 30 62, 30 46 Z" fill="#0f192d" stroke="#253556" stroke-width="2.5"/>
  <!-- Neon X on left -->
  <path d="M42 50 L52 60 M52 50 L42 60" stroke="#ff4757" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Neon O on right -->
  <circle cx="72" cy="55" r="5.5" stroke="#3498db" stroke-width="3.5" filter="url(#glow)"/>
  <!-- Central LED -->
  <circle cx="60" cy="46" r="2.5" fill="#2ecc71"/>
</svg>