  <path d="M36 52 C36 42, 50 38, 70 38 C90 38, 104 42, 104 52 C104 70, 98 94, 88 94 C82 94, 78 86, 70 86 C62 86, 58 94, 52 94 C42 94, 36 70, 36 52 Z" fill="#0d1124" stroke="#2a3560" stroke-width="2"/>
