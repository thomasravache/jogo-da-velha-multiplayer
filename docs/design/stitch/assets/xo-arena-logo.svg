    </filter>
  </defs>
  <rect width="140" height="140" rx="32" fill="#111125" stroke="url(#arenaGlow)" stroke-width="3"/>
  <rect x="12" y="12" width="116" height="116" rx="24" fill="#161b33" stroke="#232b50" stroke-width="1.5"/>
