      <stop offset="0%" stop-color="#ff4757" />
      <stop offset="50%" stop-color="#70a1ff" />
      <stop offset="100%" stop-color="#00d2d3" />
    </linearGradient>
    <filter id="neonFilter" x="-20%" y="-20%" width="140%" height="140%">
