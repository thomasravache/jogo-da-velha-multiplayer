base_branch: main
max_parallel: 3
build: "dotnet build"
test: "dotnet test"
test_integration: "dotnet test --filter Category=Integration"
test_e2e: "dotnet test --filter Category=E2E"
smoke_test: "dotnet test --filter Category=Smoke"
lint: "dotnet format --verify-no-changes"
coverage: ""
coverage_min_changed_lines: 80
mutation: ""
arch_test: "dotnet test --filter Category=Architecture"
security_scan: "dotnet list package --vulnerable"
ci: "gh pr checks --watch"
deploy_staging: "push to main -> pipeline"
deploy_production: "manual trigger pipeline"
staging_url: ""
production_url: ""
test_paths:
  - "tests/**"
  - "**/*.Tests/**"
  - "**/Tests/**"
scope_exempt:
  - "docs/specs/**"
  - "docs/adr/**"
dependency_manifests:
  - "**/*.csproj"
tracker:
  provider: none
pr_title: "{conv}: {title} [{id}]"
root_docs:
  - AGENTS.md
  - README.md
changelog: CHANGELOG.md
dod_extra: []
